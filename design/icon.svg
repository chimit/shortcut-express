<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- The skirt is the cap's wall, not its shadow: lit from above it is a
         step below the face, and only the bottom edge falls away to dark. -->
    <linearGradient id="skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#495363"/>
      <stop offset="0.55" stop-color="#343d47"/>
      <stop offset="1" stop-color="#232a33"/>
    </linearGradient>
    <!-- A MOA face is dished, so it lights the opposite way round to a dome:
         the near rim shades the top of the bowl, the light pools low, and the
         bottom edge turns away again. -->
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4650"/>
      <stop offset="0.38" stop-color="#4b5560"/>
      <stop offset="0.78" stop-color="#5c6773"/>
      <stop offset="1" stop-color="#464f5a"/>
    </linearGradient>
    <!-- The rim itself catches the light where the bowl cannot. -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f9bab"/>
      <stop offset="1" stop-color="#5a6470"/>
    </linearGradient>
  </defs>

  <!-- A keycap whose legend is the caret: the key, and the thing it moves. The
       face is a squircle rather than a rounded square, which is what makes a
       MOA cap read as one: the corners eat a third of each edge. -->
  <!-- macOS gives an icon a margin rather than letting it fill its canvas, and
       a cap drawn edge to edge stands out in a dock of ones that do not. The
       scale leaves exactly the 100px Apple's grid asks for, about the centre so
       nothing shifts. -->
  <g transform="translate(41.1 41.1) scale(0.9196)">
    <rect x="64" y="48" width="896" height="912" rx="208" fill="url(#skirt)"/>
    <path d="M176,466 C176,221 250,152 512,152 C774,152 848,221 848,466 C848,711 774,780 512,780 C250,780 176,711 176,466 Z" fill="url(#face)" stroke="url(#rim)" stroke-width="6"/>

    <!-- The caret alone: the serifs would make it the mouse's I-beam instead. -->
    <rect x="480" y="272" width="64" height="388" rx="32" fill="#95c5f8"/>
  </g>
</svg>
